# DXVK configuration for Hard Truck 2: King of the Road
# Translates D3D9 calls directly into Vulkan for maximum performance on Intel/Mesa

d3d9.maxFrameLatency = 1
d3d9.presentInterval = 0
d3d9.samplerAnisotropy = 0
d3d9.deferSurfaceCreation = True
d3d9.maxAvailableMemory = 512
d3d9.cachedDynamicBuffers = True
d3d9.numBackBuffers = 1
d3d9.lenientClear = True
d3d9.allowDiscard = True
dxvk.enableAsync = true

