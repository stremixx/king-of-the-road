; D2GI configuration file
; High-performance DirectDraw7/Direct3D7 -> Direct3D9 Hardware Accelerated Wrapper
; Eliminates CPU surface readback bottlenecks for smooth 60 FPS gameplay

[VIDEO]
Width       = 0
Height      = 0
WindowMode  = borderless
EnableVSync = 0
FixAlpha    = 1
AnisotropyLevel = 0
MSAALevel = 0

[HOOKS]
EnableHooks = 1
EnableUIFix = 1
EnableMirrorsFix = 0
AllCoresAffinity = 1

[SCREENSHOTS]
SavePath = .\\screenshots
ImageFormat = jpg

[TEXTUREUVOVERRIDES]
aq.forest1, CLAMP, WRAP
